name: Deploy to Production

on:
  push:
    branches:
      - main

# Prevent two deploys from racing on the same VPS state.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE_SCRIPT'
            set -euo pipefail

            cd /opt/apps/greenpi

            echo "==> Updating repository to origin/main"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "==> Building backend image"
            docker compose -f docker-compose.prod.yml build

            echo "==> Applying Prisma migrations (migrate deploy, non-destructive)"
            docker compose -f docker-compose.prod.yml run --rm -T greenpi-backend npx prisma migrate deploy < /dev/null

            echo "==> Starting/updating backend container"
            docker compose -f docker-compose.prod.yml up -d

            echo "==> Waiting for container to come up"
            sleep 5
            docker ps --filter "name=greenpi-backend"
            docker logs greenpi-backend --tail 50

            echo "==> Health check"
            curl -fsS http://localhost:4100/health > /dev/null
            echo "Health check OK"
          REMOTE_SCRIPT

      - name: Clean up SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
